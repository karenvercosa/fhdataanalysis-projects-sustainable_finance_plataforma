sonar.projectKey=sustainable_finance_plataforma
sonar.projectName=Sustainable Finance Plataforma
sonar.projectVersion=1.0

# ─── Escopo da análise ───────────────────────────────────────────────────────
# Raiz do repositório: além do src (TS/TSX), isso faz o Sonar analisar também
# Dockerfiles, docker-compose*.yml, os workflows do GitHub Actions, os scripts
# shell e o schema do Prisma (analisadores sonar-iac / sonar-shell / sonar-text).
# É o que traz as regras de SEGURANÇA de infraestrutura, que ficavam de fora
# quando o escopo era só `src`.
sonar.sources=.
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# ─── Exclusões da análise ────────────────────────────────────────────────────
# Só sai daqui o que não é código-fonte do projeto: dependências, artefatos de
# build, relatórios e binários/assets.
# `.env*` é obrigatório: o detector de segredos leria as credenciais reais e
# abriria issues BLOCKER (o arquivo está no .gitignore, mas o scanner roda
# sobre o diretório montado, não sobre o índice do git).
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/coverage/**,\
  **/public/**,\
  **/*.d.ts,\
  **/.env*,\
  .agents/**,\
  .claude/**,\
  prisma/init.sql,\
  prisma/landing-page-content.json,\
  yarn.lock

# ─── Exclusões de cobertura ──────────────────────────────────────────────────
# Mantido em sincronia com `coverage.exclude` em vitest.config.ts.
# Os arquivos continuam sendo ANALISADOS (bugs, smells, segurança); apenas não
# entram no cálculo do percentual de cobertura.
sonar.coverage.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/__tests__/**,\
  src/test/**,\
  types/**,\
  next.config.js,\
  postcss.config.js,\
  tailwind.config.js,\
  prisma/seed.ts,\
  scripts/**,\
  src/app/manifest.ts,\
  src/app/layout.tsx,\
  src/ClientRoot.tsx

# ─── Exclusões de duplicação (CPD) ───────────────────────────────────────────
# Conteúdo estático bilíngue (PT/EN) e catálogos de dados: a estrutura PT/EN é
# naturalmente espelhada; não é lógica duplicada e não deve ser refatorada.
# Os templates de e-mail compartilham a mesma moldura de tabela HTML por
# exigência dos clientes de e-mail — reaproveitar geraria HTML inválido.
sonar.cpd.exclusions=\
  src/data/**,\
  src/messages/**,\
  src/emails/**

# ─── Cobertura ───────────────────────────────────────────────────────────────
# Relatório lcov gerado pelo Vitest (`yarn test:cov`).
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ─── Servidor local (token passado em runtime pelo start.sh) ─────────────────
sonar.host.url=http://localhost:9000

sonar.sourceEncoding=UTF-8
