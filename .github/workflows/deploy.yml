# ==============================================================================
# Deploy — Sustainable Finance (Plataforma)
#
# Responsabilidade deste workflow: TESTAR, ESCANEAR e PUBLICAR as 3 imagens no
# Docker Hub, com exatamente os mesmos nomes/tags declarados no provisionamento
# (provisionamento_susfinance_plataforma/ansible/project.yml):
#
#   plataforma → sustainablefinances/sustainable-finance:plataforma-v1.0.0
#   db         → sustainablefinances/sustainable-finance:db-v1.0.0
#   redis      → sustainablefinances/sustainable-finance:redis-v1.0.0
#
# As tags `db-` e `redis-` são as MESMAS publicadas pela pipeline da landing
# page — os dois apps compartilham o mesmo Postgres e o mesmo Redis no cluster.
# ==============================================================================

name: Deploy Next.js to Production

on:
  push:
    branches: [main]

env:
  IMAGE_REPO: "${{ secrets.DOCKER_HUB_USERNAME }}/sustainable-finance"

jobs:
  # ── 1. Testes ───────────────────────────────────────────────────────────────
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Tests
        run: yarn test

  # ── 2. Build + Trivy + Push (uma execução por imagem, em paralelo) ──────────
  build:
    name: Build, Scan and Push (${{ matrix.name }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: plataforma
            dockerfile: Dockerfile
            tag: plataforma-v1.0.0
          - name: db
            dockerfile: Dockerfile.db
            tag: db-v1.0.0
          - name: redis
            dockerfile: Dockerfile.redis
            tag: redis-v1.0.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build local (load) para o Trivy escanear ANTES de qualquer push.
      - name: Build image locally for Trivy
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ env.IMAGE_REPO }}:${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_REPO }}:${{ matrix.tag }}'
          format: 'table'
          exit-code: '1' # Falha a pipeline se encontrar vulnerabilidades
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.IMAGE_REPO }}:${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.name }}

  # ── 3. Rollout no K3s (só depois das 3 imagens publicadas) ──────────────────
  deploy:
    name: Rollout on K3s
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Rollout on K3s
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            echo "🚀 Iniciando Rollout no Kubernetes..."
            KUBECONFIG=/etc/rancher/k3s/k3s.yaml /usr/local/bin/kubectl rollout restart deployment susfinance-plataforma -n apps
            echo "📊 Aguardando estabilização..."
            KUBECONFIG=/etc/rancher/k3s/k3s.yaml /usr/local/bin/kubectl rollout status deployment susfinance-plataforma -n apps --timeout=120s
            echo "✅ Deploy Concluído!"
